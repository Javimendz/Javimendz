<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Javier Méndez, Junior Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="55%" stop-color="#0a1130"/>
      <stop offset="100%" stop-color="#1b0a3d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- resplandores de fondo -->
    <circle cx="140" cy="60" r="140" fill="#00f0ff" opacity="0.07"/>
    <circle cx="880" cy="210" r="170" fill="#ff2bd6" opacity="0.08"/>

    <!-- estrellas -->
    <g fill="#ffffff">
      <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="200" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="90" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="230" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="215" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="25" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="235" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="45" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="120" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="35" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.1s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="150" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="140" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- línea de escaneo -->
    <rect x="0" y="-40" width="1000" height="40" fill="url(#scan)">
      <animate attributeName="y" from="-40" to="260" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- textos -->
    <text x="500" y="112" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="58" font-weight="700" letter-spacing="6" fill="url(#neon)" filter="url(#glow)">JAVIER MÉNDEZ</text>
    <text x="500" y="156" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="22" letter-spacing="9" fill="#7df9ff">JUNIOR BACKEND DEVELOPER</text>
    <text x="500" y="198" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="15" letter-spacing="2" fill="#c8b6ff">Java · Spring Boot · TypeScript · Python · C#  →  Go</text>

    <!-- esquinas -->
    <g fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round">
      <path d="M 24 60 L 24 24 L 60 24"/>
      <path d="M 940 24 L 976 24 L 976 60"/>
      <path d="M 24 200 L 24 236 L 60 236"/>
      <path d="M 940 236 L 976 236 L 976 200"/>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="258" rx="14" fill="none" stroke="url(#neon)" stroke-opacity="0.5" stroke-width="2"/>
</svg>
